databases:
  - name: milson-erp-db
    databaseName: milson_erp
    plan: free
    region: ohio

services:
  - type: web
    name: milson-erp
    runtime: node
    plan: free
    region: ohio
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: milson-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://milson-erp.onrender.com
